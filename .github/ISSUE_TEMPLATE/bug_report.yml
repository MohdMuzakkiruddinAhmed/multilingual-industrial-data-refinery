name: Bug report
description: Report a reproducible extraction, validation, reporting, or setup issue.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Use synthetic examples. Do not include API keys, private catalogs, or sensitive logs."
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command, synthetic case ID, and relevant output.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python version, commit, provider (rules or NIM)"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots or redacted logs, if useful.
