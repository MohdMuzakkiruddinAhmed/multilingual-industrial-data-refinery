<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Multilingual Industrial Data Refinery</title>
  <desc id="desc">Evidence-linked catalog refinement. English, German, Spanish, and Arabic. Sources, facts, checks, and market views.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1524"/><stop offset="1" stop-color="#12323d"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a5dce5" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="20" fill="url(#grid)"/>
  <rect x="48" y="44" width="4" height="24" rx="2" fill="#63e7ca"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="68" y="62" fill="#76e5d0" font-size="14" font-weight="700" letter-spacing="2.2">EVIDENCE · LANGUAGE · INDUSTRY</text>
    <text x="48" y="135" fill="#f3f8fc" font-size="47" font-weight="700">Multilingual Industrial</text>
    <text x="48" y="193" fill="#f3f8fc" font-size="47" font-weight="700">Data Refinery</text>
    <text x="50" y="235" fill="#bbd1dd" font-size="19">From source evidence to verified catalog records.</text>
    <text x="50" y="278" fill="#8eacbb" font-size="14" letter-spacing="1.3">ENGLISH  /  GERMAN  /  SPANISH  /  ARABIC</text>
    <g fill="#173844" stroke="#315563">
      <rect x="48" y="315" width="161" height="40" rx="8"/>
      <rect x="221" y="315" width="171" height="40" rx="8"/>
      <rect x="404" y="315" width="163" height="40" rx="8"/>
    </g>
    <g fill="#dfedf2" font-size="14">
      <text x="67" y="340">1,728 synthetic cases</text>
      <text x="239" y="340">1,920 source documents</text>
      <text x="425" y="340">49 offline tests</text>
    </g>
    <g transform="translate(762 67)">
      <path d="M26 41V245" stroke="#3e7180" stroke-width="2"/>
      <g fill="#173541" stroke="#396370">
        <rect width="421" height="56" rx="10"/>
        <rect y="70" width="421" height="56" rx="10"/>
        <rect y="140" width="421" height="56" rx="10" stroke="#63e7ca"/>
        <rect y="210" width="421" height="56" rx="10"/>
      </g>
      <g fill="#63e7ca"><circle cx="27" cy="28" r="5"/><circle cx="27" cy="98" r="5"/><circle cx="27" cy="168" r="5"/><circle cx="27" cy="238" r="5"/></g>
      <g fill="#e6f0f5" font-size="16" font-weight="700">
        <text x="51" y="34">Sources</text><text x="51" y="104">Typed facts</text>
        <text x="51" y="174">Evidence checks</text><text x="51" y="244">Market views</text>
      </g>
      <g fill="#9ebbc7" font-size="13" text-anchor="end">
        <text x="400" y="34">REGISTER + HASH</text><text x="400" y="104">RULES / NIM</text>
        <text x="400" y="174">VERIFY + NORMALIZE</text><text x="400" y="244">SIMULATED EXPORT</text>
      </g>
      <text x="0" y="297" fill="#8eacbb" font-size="12" letter-spacing="1.4">REPRODUCIBLE RESEARCH PROTOTYPE</text>
    </g>
  </g>
</svg>
