<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Industrial Data Refinery | Evidence review</title>
<style>
:root{color-scheme:light;--ink:#122c37;--muted:#5c727a;--line:#dce6e7;--green:#087f73;--amber:#95600c}
*{box-sizing:border-box}body{margin:0;background:#f3f7f7;color:var(--ink);font:15px/1.55 system-ui,sans-serif}
header{background:#102e39;color:white;padding:32px max(28px,calc((100vw - 1360px)/2));border-bottom:5px solid #78d9bf}
.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#89d9c8}h1{font-size:32px;font-weight:600;letter-spacing:-1px;margin:7px 0}header p{color:#bed3d9;margin:0;max-width:850px}
main{max-width:1420px;margin:auto;padding:26px 28px}.topline{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.tag{font-size:11px;letter-spacing:1px;border:1px solid #b8d0d2;padding:5px 9px;border-radius:5px}.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.stat{background:white;border:1px solid var(--line);padding:18px 22px;border-radius:9px}.stat strong{font-size:30px;display:block;letter-spacing:-1px}.stat span{font-size:12px;color:var(--muted)}
.workspace{display:grid;grid-template-columns:310px 1fr;gap:22px}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.panel-head{padding:18px 20px;border-bottom:1px solid var(--line);font-weight:650}.filter{padding:14px 16px;display:grid;gap:9px}input,select{width:100%;padding:10px;border:1px solid #c8d9dc;border-radius:5px;background:white;color:var(--ink);font:inherit}
#cases{max-height:890px;overflow:auto}.case{display:block;width:100%;text-align:left;border:0;border-top:1px solid #edf1f2;padding:14px 18px;background:white;color:var(--ink);cursor:pointer}.case:hover{background:#f3f9f7}.case.active{background:#eaf6f2;box-shadow:inset 4px 0 var(--green)}.case-title{font-weight:620;font-size:13px}.case-meta{display:flex;justify-content:space-between;font-size:11px;margin-top:5px;color:var(--muted)}
.badge{padding:3px 8px;border-radius:20px;font-size:11px;white-space:nowrap;background:#e5f5ef;color:#006b51}.badge.review{background:#fff0d8;color:var(--amber)}.detail{padding:24px}.detail h2{margin:0 0 5px;font-size:23px}.detail h3{font-size:12px;letter-spacing:1px;text-transform:uppercase;margin:28px 0 10px}.flow{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.step{font-size:11px;padding:5px 10px;background:#eef4f5;border-radius:4px}.issues{padding:12px 16px;background:#fff8ec;border:1px solid #f0dfbb;border-radius:6px;font-size:13px}.issues p{margin:5px 0}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}td small{display:block;color:var(--muted);margin-top:4px}.quote{font:12px/1.6 ui-monospace,monospace;color:#35656c;overflow-wrap:anywhere}
.view{padding:18px;background:#f1f8f6;border:1px solid #cce3da;border-radius:7px}.view h4{font-size:19px;margin:0 0 12px}.view-row{display:flex;justify-content:space-between;gap:18px;padding:5px 0;border-bottom:1px solid #dcebe5;font-size:13px}.source{padding:12px 14px;margin:8px 0;background:#f7f9fa;border-radius:5px;font-size:13px;overflow-wrap:anywhere}.source p{margin:6px 0}.source code{font-size:10px;color:var(--muted)}details{margin-top:14px}summary{cursor:pointer;color:var(--green);font-size:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;background:#f7f9fa;padding:12px;max-height:380px;overflow:auto}footer{margin-top:24px;color:var(--muted);font-size:12px}.breakdown{display:flex;gap:20px;flex-wrap:wrap;font-size:12px;margin:12px 0 22px}.empty{padding:25px;color:var(--muted)}
@media(max-width:900px){.workspace{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}#cases{max-height:270px}.detail{padding:16px}main{padding:18px 12px}header{padding:24px}table{font-size:11px}.topline{align-items:flex-start;flex-direction:column}}
</style></head><body>
<header><div class="eyebrow">Research prototype / 01</div><h1>Multilingual Data Refinery</h1><p>From source evidence to controlled catalog views. Inspect every accepted fact, blocked transformation, and publication decision.</p></header>
<main><div class="topline"><div id="runlabel" class="muted"></div><span class="tag">SYNTHETIC DATA · SIMULATED PUBLICATION</span></div>
<div class="stats" id="stats"></div><div class="breakdown" id="breakdown"></div>
<div class="workspace"><aside class="panel"><div class="panel-head">Case explorer</div><div class="filter"><input id="search" aria-label="Search cases" placeholder="Search cases…"><select id="status" aria-label="Filter state"><option value="all">All decisions</option><option value="approved">Approved</option><option value="review_required">Review required</option></select></div><div id="cases"></div></aside><section class="panel detail" id="detail"></section></div>
<footer id="foot"></footer></main>
<script id="run-data" type="application/json">__RUN_DATA__</script>
<script>
const run=JSON.parse(document.getElementById('run-data').textContent),m=run.metrics;
const $=id=>document.getElementById(id), el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;};
const pct=x=>x===null?'—':(100*x).toFixed(1)+'%',pretty=x=>x.replaceAll('_',' ');
$('runlabel').textContent=`${run.provider==='nim'?'NVIDIA NIM':'Offline rules baseline'} · ${run.model||'Deterministic extraction'} · ${run.created_at}`;
[['Cases passing',`${m.passed} / ${m.cases}`],['Auto-acceptance',pct(m.auto_acceptance_rate)],['Accepted record correctness',pct(m.accepted_record_correctness)],['Evidence link coverage',pct(m.evidence_link_coverage)]].forEach(([label,value])=>{const card=el('div',undefined,'stat');card.append(el('strong',value),el('span',label));$('stats').append(card);});
Object.entries(m.by_language).forEach(([lang,v])=>$('breakdown').append(el('span',`${lang.toUpperCase()} · ${v.passed}/${v.cases} passed · ${v.approved} approved`)));
$('foot').textContent=`${m.scope} ${run.usage.requests} API requests · ${run.usage.total_tokens} reported tokens · ${run.elapsed_seconds}s elapsed. The es-MX certificate requirement is a fictional organization policy. NIM model aliases are not pinned model weights.`;
let selected=run.results[0]?.case_id;
const caseTitle=r=>r.benchmark?`${pretty(r.benchmark.scenario)} · ${r.benchmark.group}`:pretty(r.case_id);
function renderList(){const search=$('search').value.toLowerCase(),status=$('status').value;$('cases').replaceChildren();run.results.filter(r=>(status==='all'||r.state===status)&&(caseTitle(r)+' '+r.case_id+' '+r.market).toLowerCase().includes(search)).forEach(r=>{const b=el('button',undefined,'case'+(r.case_id===selected?' active':''));b.append(el('div',caseTitle(r),'case-title'));const meta=el('div',undefined,'case-meta');meta.append(el('span',(r.benchmark?r.benchmark.language+' → ':'')+r.market),el('span',pretty(r.state)));b.append(meta);b.onclick=()=>{selected=r.case_id;renderList();renderDetail(r);};$('cases').append(b);});if(!$('cases').children.length)$('cases').append(el('div','No matching cases','empty'));}
function renderDetail(r){const box=$('detail');box.replaceChildren();box.append(el('h2',caseTitle(r)),el('span',pretty(r.state),'badge'+(r.state==='approved'?'':' review')),el('p',`Identity decision: ${pretty(r.matching.outcome)} · ${pretty(r.matching.reason)}`,'muted'));const flow=el('div',undefined,'flow');r.lifecycle.forEach(s=>flow.append(el('span',pretty(s),'step')));box.append(flow);
if(r.issues.length){const issues=el('div',undefined,'issues');r.issues.forEach(i=>issues.append(el('p',pretty(i.code)+(i.field?' · '+i.field:'')+(i.detail?' · '+i.detail:''))));box.append(issues);}
box.append(el('h3','Canonical facts & evidence'));const table=el('table'),head=el('tr');['Attribute','Canonical value','Source evidence'].forEach(v=>head.append(el('th',v)));table.append(head);Object.entries(r.attributes).forEach(([key,a])=>{const tr=el('tr'),value=el('td',a.value+(a.unit?' '+a.unit:'')),ev=el('td');value.append(el('small',a.status));a.evidence.forEach(e=>{ev.append(el('div',e.quote,'quote'),el('small',`${e.source_id} · chars ${e.start}–${e.end} · ${e.rule}`));});tr.append(el('td',key),value,ev);table.append(tr);});box.append(table);if(!Object.keys(r.attributes).length)box.append(el('p','No accepted facts.','muted'));
box.append(el('h3','Controlled market view'));const view=el('div',undefined,'view');view.dir=r.view.direction;view.lang=r.view.language;view.append(el('h4',r.view.title));r.view.rows.forEach(row=>{const line=el('div',undefined,'view-row');line.append(el('span',row.label),el('strong',row.display));view.append(line);});view.append(el('small',r.publication?'Eligible for simulated publication':'Publication blocked — review required'));box.append(view);
box.append(el('h3','Registered sources'));r.sources.forEach(s=>{const source=el('div',undefined,'source');source.append(el('strong',`${s.id} · ${s.language} · ${s.eligible?'eligible':'inactive / superseded'}`),el('p',s.text),el('code',`SHA-256 ${s.sha256}`));box.append(source);});
if(r.advisory_review){box.append(el('h3','Advisory evidence review'),el('p',r.advisory_review.summary||r.advisory_review.error));}
[['Agent decisions',r.decisions],['Proposals and rejections',{proposals:r.proposals,rejected:r.rejected_proposals}],['Expected vs actual',m.details.find(d=>d.case_id===r.case_id)],['Complete record',r]].forEach(([title,data])=>{const d=el('details');d.append(el('summary',title),el('pre',JSON.stringify(data,null,2)));box.append(d);});}
$('search').oninput=renderList;$('status').onchange=renderList;renderList();if(run.results.length)renderDetail(run.results[0]);
</script></body></html>
